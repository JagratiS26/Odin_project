<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class-Id</title>
    <style>
     .Odd{
        background-color:rgb(255, 182, 193);
        font-family:"Verdana", "DejaVu Sans", sans-serif;
     }
     #two{
        color: cadetblue;
        font-size: 36px;
     }
     .Odd#three{
        font-size: 24px;
     }
     #four{
        background-color: lightgreen;
        font-size: 24px;
        font-weight: bold;
     }
    </style>
</head>
<body>
    <div class="Odd" id="one">Number 1- I am class!</div>
    <br>
    <div id="two">Number 2-  I am one ID.</div>
    <br>
    <div class="Odd" id="three">Number 3- I am a class, but cooler!</div>
    <br>
    <div id="four">Number 4- I am another ID.</div>
    <br>
    <div class="Odd">Number 5- I am another class.</div>
</body>
</html>
